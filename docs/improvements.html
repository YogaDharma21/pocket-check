<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PocketCheck - Improvement &amp; Refactoring Matrix</title>
  <style>
    :root {
      --background: #08090b;
      --foreground: #f4f4f2;
      --card: #121316;
      --card-foreground: #f4f4f2;
      --surface: #17181c;
      --surface-foreground: #f4f4f2;
      --surface-inset: rgba(255, 255, 255, 0.035);
      --popover: #15161a;
      --popover-foreground: #f4f4f2;
      --primary: #f2f1ec;
      --primary-foreground: #0a0a0b;
      --secondary: #17181c;
      --secondary-foreground: #f4f4f2;
      --muted: #17181c;
      --muted-foreground: #8a8c92;
      --subtle-foreground: #5f6065;
      --border: rgba(255, 255, 255, 0.07);
      --border-subtle: rgba(255, 255, 255, 0.04);
      --emerald: #a9bfa9;
      --emerald-bg: rgba(169, 191, 169, 0.12);
      --emerald-border: rgba(169, 191, 169, 0.25);
      --crimson: #c99a90;
      --crimson-bg: rgba(194, 133, 123, 0.13);
      --crimson-border: rgba(194, 133, 123, 0.25);
      --amber: #d2bd93;
      --amber-bg: rgba(210, 189, 147, 0.12);
      --amber-border: rgba(210, 189, 147, 0.25);
      --blue: #a6b0bd;
      --blue-bg: rgba(166, 176, 189, 0.12);
      --blue-border: rgba(166, 176, 189, 0.25);
      --font-sans: -apple-system, BlinkMacSystemFont, "Geist", "Inter", "Segoe UI", Roboto, sans-serif;
      --font-mono: "Geist Mono", "JetBrains Mono", "SF Mono", Menlo, Consolas, monospace;
      --shadow-surface: 0 28px 56px -40px rgba(0, 0, 0, 0.9);
      --radius-card: 24px;
      --radius-inset: 16px;
      --radius-btn: 12px;
      --radius-pill: 9999px;
      --radius-micro: 2px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      border-color: var(--border);
    }

    body {
      background-color: var(--background);
      color: var(--foreground);
      font-family: var(--font-sans);
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
      padding: 32px 24px 96px 24px;
    }

    .tabular-nums {
      font-variant-numeric: tabular-nums;
      font-family: var(--font-mono);
    }

    .container {
      max-width: 1240px;
      margin: 0 auto;
    }

    header {
      margin-bottom: 32px;
    }

    .header-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      flex-wrap: wrap;
      margin-bottom: 24px;
    }

    .brand-group {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .brand-icon {
      width: 40px;
      height: 40px;
      border-radius: 12px;
      background: var(--surface-inset);
      border: 1px solid var(--border);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      color: var(--primary);
    }

    h1 {
      font-size: 24px;
      font-weight: 600;
      letter-spacing: -0.025em;
      color: var(--foreground);
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 16px;
      margin-bottom: 32px;
    }

    .stat-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius-card);
      box-shadow: var(--shadow-surface);
      padding: 20px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      min-height: 120px;
      transition: all 0.3s ease-out;
    }

    .stat-card-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 8px;
    }

    .stat-label {
      font-size: 10px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.16em;
      color: var(--muted-foreground);
    }

    .stat-icon {
      padding: 6px;
      border-radius: 10px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    .stat-value {
      font-size: 26px;
      font-weight: 600;
      letter-spacing: -0.03em;
      color: var(--foreground);
      margin: 4px 0;
    }

    .stat-sub {
      font-size: 11px;
      color: var(--muted-foreground);
    }

    .controls-panel {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius-card);
      box-shadow: var(--shadow-surface);
      padding: 16px;
      margin-bottom: 24px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .controls-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
    }

    .filter-tabs {
      display: inline-flex;
      align-items: center;
      background: var(--surface-inset);
      padding: 4px;
      border-radius: var(--radius-pill);
      gap: 4px;
      flex-wrap: wrap;
    }

    .filter-tab {
      background: transparent;
      border: none;
      color: var(--muted-foreground);
      font-family: var(--font-sans);
      font-size: 13px;
      font-weight: 500;
      padding: 8px 16px;
      border-radius: var(--radius-pill);
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      transition: all 0.3s ease-out;
    }

    .filter-tab:hover {
      color: var(--foreground);
    }

    .filter-tab.active {
      background: var(--primary);
      color: var(--primary-foreground);
      font-weight: 600;
    }

    .filter-tab .badge {
      font-size: 10px;
      padding: 2px 7px;
      border-radius: 9999px;
      background: rgba(0, 0, 0, 0.15);
      color: inherit;
    }

    .filter-tab.active .badge {
      background: rgba(0, 0, 0, 0.2);
      color: var(--primary-foreground);
    }

    .search-box {
      position: relative;
      flex: 1;
      min-width: 260px;
    }

    .search-input {
      width: 100%;
      height: 44px;
      background: var(--surface-inset);
      border: none;
      border-radius: var(--radius-pill);
      color: var(--foreground);
      font-family: var(--font-sans);
      font-size: 13px;
      padding: 0 16px 0 42px;
      outline: none;
      transition: all 0.3s ease-out;
    }

    .search-input:focus {
      box-shadow: 0 0 0 1px var(--ring);
    }

    .search-input::placeholder {
      color: var(--subtle-foreground);
    }

    .search-icon {
      position: absolute;
      left: 16px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--muted-foreground);
      pointer-events: none;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .secondary-filters {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
      padding-top: 12px;
      border-top: 1px solid var(--border-subtle);
    }

    .score-pills {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
    }

    .score-pill-btn {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--muted-foreground);
      font-family: var(--font-mono);
      font-size: 11px;
      font-weight: 500;
      padding: 4px 10px;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.3s ease-out;
    }

    .score-pill-btn:hover {
      color: var(--foreground);
      border-color: var(--ring);
    }

    .score-pill-btn.active {
      background: var(--surface-inset);
      color: var(--foreground);
      border-color: var(--foreground);
    }

    .sort-group {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .sort-label {
      font-size: 11px;
      color: var(--muted-foreground);
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }

    .select-input {
      background: var(--surface-inset);
      border: 1px solid var(--border);
      color: var(--foreground);
      font-family: var(--font-sans);
      font-size: 12px;
      padding: 6px 12px;
      border-radius: 8px;
      outline: none;
      cursor: pointer;
    }

    .items-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(370px, 1fr));
      gap: 16px;
    }

    .item-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius-card);
      box-shadow: var(--shadow-surface);
      padding: 20px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      transition: all 0.3s ease-out;
      position: relative;
    }

    .item-card:hover {
      border-color: rgba(255, 255, 255, 0.15);
    }

    .item-header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 12px;
    }

    .tag-cluster {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
    }

    .category-tag {
      font-size: 10px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      padding: 3px 8px;
      border-radius: 6px;
      display: inline-flex;
      align-items: center;
      gap: 5px;
    }

    .category-tag.feature {
      background: var(--emerald-bg);
      color: var(--emerald);
      border: 1px solid var(--emerald-border);
    }

    .category-tag.adjustment {
      background: var(--amber-bg);
      color: var(--amber);
      border: 1px solid var(--amber-border);
    }

    .category-tag.bug {
      background: var(--crimson-bg);
      color: var(--crimson);
      border: 1px solid var(--crimson-border);
    }

    .subsystem-tag {
      font-size: 10px;
      font-weight: 500;
      color: var(--blue);
      background: var(--blue-bg);
      border: 1px solid var(--blue-border);
      padding: 3px 8px;
      border-radius: 6px;
    }

    .score-badge {
      display: inline-flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 3px;
      flex-shrink: 0;
    }

    .score-numeric {
      font-family: var(--font-mono);
      font-size: 13px;
      font-weight: 600;
      color: var(--foreground);
    }

    .score-meter {
      width: 48px;
      height: 4px;
      background: var(--surface-inset);
      border-radius: var(--radius-micro);
      overflow: hidden;
    }

    .score-bar {
      height: 100%;
      border-radius: var(--radius-micro);
      transition: width 0.3s ease-out;
    }

    .item-title {
      font-size: 15px;
      font-weight: 500;
      letter-spacing: -0.015em;
      color: var(--foreground);
      margin-bottom: 8px;
      line-height: 1.4;
    }

    .item-desc {
      font-size: 13px;
      color: var(--muted-foreground);
      line-height: 1.5;
      margin-bottom: 16px;
      flex-grow: 1;
    }

    .item-footer {
      border-top: 1px solid var(--border-subtle);
      padding-top: 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .seam-label {
      font-size: 11px;
      color: var(--subtle-foreground);
      font-family: var(--font-mono);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      max-width: 240px;
    }

    .item-id {
      font-size: 10px;
      font-family: var(--font-mono);
      color: var(--subtle-foreground);
    }

    .empty-state {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius-card);
      padding: 48px 24px;
      text-align: center;
      color: var(--muted-foreground);
      font-size: 14px;
      grid-column: 1 / -1;
    }

    .btn {
      height: 40px;
      padding: 0 16px;
      border-radius: var(--radius-btn);
      font-family: var(--font-sans);
      font-size: 13px;
      font-weight: 500;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
      transition: all 0.3s ease-out;
    }

    .btn:active {
      transform: scale(0.95);
    }

    .btn-secondary {
      background: var(--surface);
      color: var(--foreground);
      border: 1px solid var(--border);
    }

    .btn-secondary:hover {
      background: var(--surface-inset);
      border-color: rgba(255, 255, 255, 0.15);
    }

    .count-indicator {
      font-size: 12px;
      color: var(--muted-foreground);
      font-family: var(--font-mono);
    }

    @media (max-width: 768px) {
      body {
        padding: 16px 12px 64px 12px;
      }
      .items-grid {
        grid-template-columns: 1fr;
      }
      .header-top {
        flex-direction: column;
        align-items: flex-start;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <div class="header-top">
        <div class="brand-group">
          <div class="brand-icon">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M21 8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16Z"/>
              <path d="m3.3 7 8.7 5 8.7-5"/>
              <path d="M12 22V12"/>
            </svg>
          </div>
          <div>
            <h1>PocketCheck Improvement Matrix</h1>
          </div>
        </div>

        <div class="header-actions">
          <span class="count-indicator" id="visibleCounter">Showing 45 of 45 proposals</span>
          <button class="btn btn-secondary" onclick="exportMarkdownSummary()">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
              <polyline points="7 10 12 15 17 10"/>
              <line x1="12" y1="15" x2="12" y2="3"/>
            </svg>
            Export List
          </button>
        </div>
      </div>

      <div class="stats-grid">
        <div class="stat-card">
          <div class="stat-card-header">
            <span class="stat-label">Total Backlog</span>
            <div class="stat-icon" style="background: var(--blue-bg); color: var(--blue);">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/><rect x="8" y="2" width="8" height="4" rx="1" ry="1"/></svg>
            </div>
          </div>
          <div class="stat-value tabular-nums" id="statTotal">45</div>
          <div class="stat-sub">Comprehensive architectural tickets</div>
        </div>

        <div class="stat-card">
          <div class="stat-card-header">
            <span class="stat-label">Critical (10/10)</span>
            <div class="stat-icon" style="background: var(--crimson-bg); color: var(--crimson);">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
            </div>
          </div>
          <div class="stat-value tabular-nums" id="statCritical" style="color: var(--crimson);">5</div>
          <div class="stat-sub">Immediate blocking defects &amp; sync</div>
        </div>

        <div class="stat-card">
          <div class="stat-card-header">
            <span class="stat-label">New Features</span>
            <div class="stat-icon" style="background: var(--emerald-bg); color: var(--emerald);">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
            </div>
          </div>
          <div class="stat-value tabular-nums" id="statFeatures">15</div>
          <div class="stat-sub">Average score 8.3 / 10</div>
        </div>

        <div class="stat-card">
          <div class="stat-card-header">
            <span class="stat-label">Adjustments</span>
            <div class="stat-icon" style="background: var(--amber-bg); color: var(--amber);">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
            </div>
          </div>
          <div class="stat-value tabular-nums" id="statAdjustments">15</div>
          <div class="stat-sub">Average score 8.1 / 10</div>
        </div>

        <div class="stat-card">
          <div class="stat-card-header">
            <span class="stat-label">Bug Fixes</span>
            <div class="stat-icon" style="background: var(--crimson-bg); color: var(--crimson);">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m8 2 1.88 1.88"/><path d="M14.12 3.88 16 2"/><path d="M9 7.13v-1a3.003 3.003 0 1 1 6 0v1"/><path d="M12 20c-3.3 0-6-2.7-6-6v-3a4 4 0 0 1 4-4h4a4 4 0 0 1 4 4v3c0 3.3-2.7 6-6 6"/><path d="M12 20v-9"/><path d="M6.53 9C4.6 8.8 3 7.1 3 5"/><path d="M6 13H2"/><path d="M3 21c0-2.1 1.7-3.9 3.8-4"/><path d="M20.97 5c0 2.1-1.6 3.8-3.5 4"/><path d="M22 13h-4"/><path d="M17.2 17c2.1.1 3.8 1.9 3.8 4"/></svg>
            </div>
          </div>
          <div class="stat-value tabular-nums" id="statBugs">15</div>
          <div class="stat-sub">Average score 8.6 / 10</div>
        </div>
      </div>
    </header>

    <div class="controls-panel">
      <div class="controls-row">
        <div class="filter-tabs">
          <button class="filter-tab active" data-category="all" onclick="setCategoryFilter('all')">
            All <span class="badge" id="pillAllCount">45</span>
          </button>
          <button class="filter-tab" data-category="feature" onclick="setCategoryFilter('feature')">
            New Features <span class="badge" id="pillFeatureCount">15</span>
          </button>
          <button class="filter-tab" data-category="adjustment" onclick="setCategoryFilter('adjustment')">
            Adjustments <span class="badge" id="pillAdjustmentCount">15</span>
          </button>
          <button class="filter-tab" data-category="bug" onclick="setCategoryFilter('bug')">
            Bug Fixes <span class="badge" id="pillBugCount">15</span>
          </button>
        </div>

        <div class="search-box">
          <span class="search-icon">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
          </span>
          <input type="text" id="searchInput" class="search-input" placeholder="Search by title, description, seam..." oninput="handleSearch()">
        </div>
      </div>

      <div class="secondary-filters">
        <div class="score-pills">
          <span class="sort-label">Score:</span>
          <button class="score-pill-btn active" data-score="all" onclick="setScoreFilter('all')">All</button>
          <button class="score-pill-btn" data-score="10" onclick="setScoreFilter('10')">10/10</button>
          <button class="score-pill-btn" data-score="9" onclick="setScoreFilter('9')">9/10</button>
          <button class="score-pill-btn" data-score="8" onclick="setScoreFilter('8')">8/10</button>
          <button class="score-pill-btn" data-score="7" onclick="setScoreFilter('7')">7/10</button>
        </div>

        <div class="sort-group">
          <span class="sort-label">Sort By:</span>
          <select id="sortSelect" class="select-input" onchange="handleSort()">
            <option value="score-desc">Score (Highest First)</option>
            <option value="score-asc">Score (Lowest First)</option>
            <option value="id-asc">Ticket ID</option>
            <option value="title-asc">Title (A-Z)</option>
          </select>
        </div>
      </div>
    </div>

    <main class="items-grid" id="itemsGrid">
      <!-- Items dynamically populated via JavaScript -->
    </main>
  </div>

  <script>
    const proposals = [
      // 1. NEW FEATURES (15 items)
      {
        id: "FEAT-01",
        category: "feature",
        subsystem: "Convex / Sync",
        title: "Bi-directional Convex Offline Sync & Queueing",

    let currentCategory = "all";
    let currentScore = "all";
    let currentSearch = "";
    let currentSort = "score-desc";

    function getMeterColor(score) {
      if (score === 10) return "var(--crimson)";
      if (score === 9) return "var(--amber)";
      if (score === 8) return "var(--emerald)";
      return "var(--blue)";
    }

    function renderItems() {
      const grid = document.getElementById("itemsGrid");
      grid.innerHTML = "";

      let filtered = proposals.filter(item => {
        if (currentCategory !== "all" && item.category !== currentCategory) return false;
        if (currentScore !== "all" && item.score !== parseInt(currentScore, 10)) return false;
        if (currentSearch.trim()) {
          const q = currentSearch.toLowerCase();
          const matchTitle = item.title.toLowerCase().includes(q);
          const matchDesc = item.description.toLowerCase().includes(q);
          const matchSeam = item.seam.toLowerCase().includes(q);
          const matchSub = item.subsystem.toLowerCase().includes(q);
          const matchId = item.id.toLowerCase().includes(q);
          if (!matchTitle && !matchDesc && !matchSeam && !matchSub && !matchId) return false;
        }
        return true;
      });

      // Sorting
      filtered.sort((a, b) => {
        if (currentSort === "score-desc") return b.score - a.score;
        if (currentSort === "score-asc") return a.score - b.score;
        if (currentSort === "id-asc") return a.id.localeCompare(b.id);
        if (currentSort === "title-asc") return a.title.localeCompare(b.title);
        return 0;
      });

      // Update visible counter
      document.getElementById("visibleCounter").innerText =
        `Showing ${filtered.length} of ${proposals.length} proposals`;

      if (filtered.length === 0) {
        grid.innerHTML = `
          <div class="empty-state">
            No proposals match the selected filters.
          </div>
        `;
        return;
      }

      filtered.forEach(item => {
        const card = document.createElement("article");
        card.className = "item-card";

        const categoryLabel =
          item.category === "feature" ? "New Feature" :
          item.category === "adjustment" ? "Adjustment" : "Bug Fix";

        const barColor = getMeterColor(item.score);
        const barWidth = `${item.score * 10}%`;

        card.innerHTML = `
          <div>
            <div class="item-header">
              <div class="tag-cluster">
                <span class="category-tag ${item.category}">${categoryLabel}</span>
                <span class="subsystem-tag">${item.subsystem}</span>
              </div>
              <div class="score-badge">
                <span class="score-numeric tabular-nums">${item.score}/10</span>
                <div class="score-meter">
                  <div class="score-bar" style="width: ${barWidth}; background: ${barColor};"></div>
                </div>
              </div>
            </div>

            <h3 class="item-title">${item.title}</h3>
            <p class="item-desc">${item.description}</p>
          </div>

          <div class="item-footer">
            <span class="seam-label" title="${item.seam}">seam: ${item.seam}</span>
            <span class="item-id">${item.id}</span>
          </div>
        `;

        grid.appendChild(card);
      });
    }

    function setCategoryFilter(category) {
      currentCategory = category;
      document.querySelectorAll(".filter-tab").forEach(tab => {
        if (tab.getAttribute("data-category") === category) {
          tab.classList.add("active");
        } else {
          tab.classList.remove("active");
        }
      });
      renderItems();
    }

    function setScoreFilter(score) {
      currentScore = score;
      document.querySelectorAll(".score-pill-btn").forEach(btn => {
        if (btn.getAttribute("data-score") === score) {
          btn.classList.add("active");
        } else {
          btn.classList.remove("active");
        }
      });
      renderItems();
    }

    function handleSearch() {
      currentSearch = document.getElementById("searchInput").value;
      renderItems();
    }

    function handleSort() {
      currentSort = document.getElementById("sortSelect").value;
      renderItems();
    }

    function exportMarkdownSummary() {
      let md = "# PocketCheck Improvement & Refactoring Matrix\n\n";
      md += `Generated: ${new Date().toISOString().split("T")[0]}\n\n`;
      md += "| ID | Category | Subsystem | Score | Title | Impact Seam |\n";
      md += "| :--- | :--- | :--- | :---: | :--- | :--- |\n";

      proposals.forEach(p => {
        const cat = p.category === "feature" ? "New Feature" : p.category === "adjustment" ? "Adjustment" : "Bug Fix";
        md += `| ${p.id} | ${cat} | ${p.subsystem} | ${p.score}/10 | ${p.title} | \`${p.seam}\` |\n`;
      });

      const blob = new Blob([md], { type: "text/markdown;charset=utf-8" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = "pocketcheck-improvements.md";
      a.click();
      URL.revokeObjectURL(url);
    }

    // Initialize counts on header
    document.addEventListener("DOMContentLoaded", () => {
      renderItems();
    });
  </script>
